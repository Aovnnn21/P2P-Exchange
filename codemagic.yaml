workflows:
  android-build:
    name: Android APK Build
    max_build_duration: 60
    environment:
      vars:
        FLUTTER_VERSION: "stable"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      # ၁။ Package တွေကို အရင်ယူမယ်
      - name: Install dependencies
        script: |
          flutter pub get
      
      # ၂။ Icon တွေကို အလိုအလျောက် ထုတ်မယ် (ဒီအဆင့်က အရေးအကြီးဆုံးပါ)
      - name: Generate launcher icons
        script: |
          dart run flutter_launcher_icons
      
      # ၃။ ထို့နောက်မှ Build တင်မယ်
      - name: Build APK
        script: |
          flutter build apk --release --android-skip-build-dependency-validation
    
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
