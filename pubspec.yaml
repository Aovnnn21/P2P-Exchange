name: p2p_exchange_app
description: P2P Money Exchange App with Supabase
publish_to: 'none'
version: 1.0.0+1

environment:
  # Flutter 3.27+ (Stable) အတွက် Dart 3.6+ လိုအပ်
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.0.0
  provider: ^6.1.1
  local_auth: ^2.1.7
  device_info_plus: ^9.1.0
  otp: ^3.1.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  
  # intl version ကို 0.20.3 ကို ပြောင်းပါ
  intl: ^0.20.3
  
  url_launcher: ^6.2.1
  http: ^1.1.0
  share_plus: ^7.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Firebase packages ကိုလည်း 3.27+ ဲ့ Compatible ဖြစ်အောင် Update လုပ်ပါ
  firebase_core: ^3.8.0
  firebase_crashlytics: ^4.1.5
  firebase_analytics: ^11.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1   # <-- ဤလိုင်းကို ထည့်ပါ

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"       # Adaptive Icon (Android 8+) အတွက် နောက်ခံအရောင်
  adaptive_icon_foreground: "assets/app_icon.png"  # Adaptive Icon အတွက် အဓိကပုံရိပ်

