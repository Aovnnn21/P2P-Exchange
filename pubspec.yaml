name: p2p_exchange_app
description: P2P Money Exchange App with Supabase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase & State Management
  supabase_flutter: ^2.0.0
  provider: ^6.1.1

  # Security & Device Info
  local_auth: ^2.1.7
  device_info_plus: ^9.1.0
  otp: ^3.1.2
  qr_flutter: ^4.1.0

  # Utilities & UI
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  intl: ^0.18.1
  url_launcher: ^6.2.1
  http: ^1.1.0
  share_plus: ^7.2.1

  # Offline Mode (Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase (Crashlytics & Analytics)
  firebase_core: ^2.24.2
  firebase_crashlytics: ^3.4.9
  firebase_analytics: ^10.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
